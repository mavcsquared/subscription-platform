services:
  - type: web
    name: subscription-platform-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev is required: NODE_ENV=production (set below, applies
    # during build too) makes npm skip devDependencies by default, but
    # typescript/@types/* are devDependencies the build itself needs —
    # only the runtime (npm start) doesn't need them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
